<title>LOOP</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Noto+Sans+SC:wght@400;700;900&family=IBM+Plex+Mono:wght@500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: one narrow column — status, the lane field where enemies approach, then the 4x8 sequencer that defends those lanes, then hand + sound settings. */
:root {
  --bg: #e9ecf1;
  --surface: #f8f9fb;
  --cell: #dfe3ea;
  --fg: #1a1e29;
  --muted: #687085;
  --line: #cdd2dc;
  --life: #d6455a;
  --noise: #c93a57;
  --gold: #b9861c;
  --drum: #2f69d6;
  --bass: #138f7d;
  --harm: #8656d2;
  --lead: #d9831a;
  --fx: #5d6679;
  --enemy: #1a1e29;
  --playhead: #2f69d6;
  --f-display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif;
  --f-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11131a; --surface: #191c25; --cell: #232733; --fg: #e7eaf1; --muted: #8b93a7; --line: #2d3240;
    --life: #ef6178; --noise: #e45773; --gold: #e0ad45;
    --drum: #5b8ef0; --bass: #33b7a2; --harm: #a682ec; --lead: #f0a240; --fx: #8b93a7;
    --enemy: #e7eaf1; --playhead: #5b8ef0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11131a; --surface: #191c25; --cell: #232733; --fg: #e7eaf1; --muted: #8b93a7; --line: #2d3240;
  --life: #ef6178; --noise: #e45773; --gold: #e0ad45;
  --drum: #5b8ef0; --bass: #33b7a2; --harm: #a682ec; --lead: #f0a240; --fx: #8b93a7;
  --enemy: #e7eaf1; --playhead: #5b8ef0;
  color-scheme: dark;
}
:root:lang(zh-Hans) { --f-display: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; --f-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
:lang(zh-Hans) .modal h2 { font-weight: 900; }
:lang(zh-Hans) h1 { font-family: "Dela Gothic One", sans-serif; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 14px; line-height: 1.55; }
.app {
  max-width: 680px; margin: 0 auto;
  padding-block: 18px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 14px;
}
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--f-display); font-weight: 400; font-size: 32px; letter-spacing: .08em; margin: 0; line-height: 1; }
.status { font-family: var(--f-mono); font-size: 13px; color: var(--muted); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.status .life { color: var(--life); font-weight: 600; }
.relics { display: flex; gap: 6px; flex-wrap: wrap; }
.relic { font-size: 12px; border: 1.5px solid var(--gold); color: var(--gold); border-radius: 99px; padding: 0 8px; font-weight: 700; }

.meter { display: flex; flex-direction: column; gap: 4px; }
.meter-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); letter-spacing: .04em; }
.meter-label b { font-family: var(--f-mono); color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }
.bar { height: 8px; background: var(--cell); border-radius: 4px; overflow: hidden; position: relative; }
.bar > i { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--noise); border-radius: 4px; transition: width .15s ease-out; }
.bar.hot > i { animation: blink .3s steps(2) infinite; }
@keyframes blink { 50% { opacity: .35; } }

.stage { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
canvas#field { width: 100%; height: 168px; display: block; border-radius: 8px; background: var(--bg); }
.board { display: grid; grid-template-columns: 16px repeat(8, minmax(0, 1fr)); gap: 5px; }
.lane-num, .beat-num { font-family: var(--f-mono); font-size: 11px; color: var(--muted); display: grid; place-items: center; }
.cell {
  aspect-ratio: 1; max-width: 100%; border-radius: 8px; background: var(--cell); border: none; padding: 0;
  display: grid; place-items: center; cursor: pointer; position: relative; color: var(--fg); font: inherit;
  transition: box-shadow .06s;
}
.cell:focus-visible, .chip:focus-visible, button:focus-visible, select:focus-visible { outline: 2px solid var(--drum); outline-offset: 2px; }
.cell.ph { box-shadow: inset 0 0 0 2px var(--playhead); }
.cell.muted { opacity: .35; }
.cell.target { box-shadow: inset 0 0 0 1.5px var(--muted); }
.cell.selc { box-shadow: inset 0 0 0 2.5px var(--fg); }
.cell.hit .tile { transform: scale(1.2); }
.cell.lv2::before { content: "+"; position: absolute; left: 3px; top: -1px; font-size: 12px; font-weight: 700; color: var(--gold); }
.cell.custom::after { content: "♪"; position: absolute; right: 2px; top: 0; font-size: 10px; color: var(--muted); }
.board.over .cell { filter: grayscale(1); opacity: .5; }
.cell, .chip { touch-action: none; -webkit-user-select: none; user-select: none; }
.cell.dragging .tile, .chip.dragging { opacity: .25; }
.cell.drop { box-shadow: inset 0 0 0 2.5px var(--lead); }
#handZone { border-radius: 10px; transition: background .1s; }
#handZone.drop { background: color-mix(in srgb, var(--lead) 14%, transparent); }
.drag-ghost { position: fixed; left: 0; top: 0; width: 44px; height: 44px; display: grid; place-items: center; pointer-events: none; z-index: 30; filter: drop-shadow(0 4px 8px rgba(0,0,0,.25)); }
.drag-ghost .tile { width: 100%; height: 100%; font-size: 16px; }
.tile { width: 72%; height: 72%; display: grid; place-items: center; font-weight: 700; font-size: clamp(11px, 3.1vw, 15px); color: #fff; line-height: 1; overflow: hidden; transition: transform .1s ease-out; position: relative; }
.shape-circle { border-radius: 50%; }
.shape-square { border-radius: 4px; }
.shape-diamond { border-radius: 4px; transform: rotate(45deg) scale(.82); overflow: visible; }
.shape-diamond > em { transform: rotate(-45deg); font-style: normal; }
.cell.hit .shape-diamond { transform: rotate(45deg) scale(1); }
.shape-tri { clip-path: polygon(50% 4%, 100% 92%, 0 92%); align-content: end; padding-bottom: 12%; }
.shape-ring { border-radius: 50%; background: transparent !important; border: 3px solid currentColor; }
.cat-drum { background: var(--drum); } .cat-bass { background: var(--bass); } .cat-harm { background: var(--harm); }
.cat-lead { background: var(--lead); } .cat-fx { background: var(--fx); }
.shape-ring.cat-drum { color: var(--drum); } .shape-ring.cat-bass { color: var(--bass); } .shape-ring.cat-harm { color: var(--harm); }
.shape-ring.cat-lead { color: var(--lead); } .shape-ring.cat-fx { color: var(--fx); }
.board-foot { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; min-height: 20px; font-size: 12px; }
.over-label { font-weight: 700; color: var(--noise); }
.tempo { color: var(--muted); }
.tempo b { font-family: var(--f-mono); color: var(--lead); letter-spacing: .1em; font-size: 13px; }
.tempo.empty { animation: blink .25s steps(2) 3; color: var(--noise); }
.legend { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 12px; }
.legend b { color: var(--fg); font-weight: 700; }

.controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
button.btn {
  font: inherit; font-weight: 700; padding: 9px 16px; border-radius: 10px; border: 1.5px solid var(--fg);
  background: var(--fg); color: var(--bg); cursor: pointer; letter-spacing: .04em;
}
button.btn.ghost { background: transparent; color: var(--fg); }
button.btn:disabled { opacity: .35; cursor: default; }
button.btn.small { padding: 5px 11px; font-size: 13px; }
.sound { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; font-size: 13px; color: var(--muted); }
.sound label { display: flex; gap: 6px; align-items: center; }
select { font: inherit; color: var(--fg); background: var(--surface); border: 1.5px solid var(--line); border-radius: 8px; padding: 4px 8px; }

.panel-title { font-size: 12px; color: var(--muted); letter-spacing: .08em; margin: 0 0 6px; }
.hand { display: flex; flex-wrap: wrap; gap: 6px; min-height: 38px; }
.chip {
  display: flex; align-items: center; gap: 6px; padding: 4px 10px 4px 5px; border-radius: 99px;
  background: var(--surface); border: 1.5px solid var(--line); cursor: pointer; font: inherit; color: var(--fg);
}
.chip.sel { border-color: var(--fg); box-shadow: 0 0 0 1px var(--fg); }
.chip .tile { width: 22px; height: 22px; font-size: 11px; }
.empty-hand { color: var(--muted); font-size: 13px; align-self: center; }
.info { min-height: 52px; font-size: 13px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.info strong { font-weight: 700; }
.editor { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.note { font-family: var(--f-mono); font-weight: 600; min-width: 42px; text-align: center; font-size: 15px; }
.hint { color: var(--muted); font-size: 12px; }

.overlay { position: fixed; inset: 0; background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(3px); display: grid; place-items: center; z-index: 20;
  padding-block: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); overflow-y: auto; }
.modal { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px; width: min(560px, 100%); display: flex; flex-direction: column; gap: 14px; }
.modal h2 { font-family: var(--f-display); font-weight: 400; font-size: 24px; margin: 0; text-wrap: balance; }
.modal p { margin: 0; color: var(--muted); }
.offers { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.offers.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.offer { border: 1.5px solid var(--line); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 6px; background: var(--bg); min-width: 0; cursor: pointer; text-align: left; font: inherit; color: var(--fg); }
.offer:hover { border-color: var(--fg); }
.offer-head { display: flex; align-items: center; gap: 8px; }
.offer-head .tile { width: 26px; height: 26px; font-size: 12px; flex: none; }
.offer-name { font-weight: 700; }
.offer-desc { font-size: 12px; color: var(--muted); }
.row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: space-between; align-items: center; }
details { font-size: 13px; color: var(--muted); }
details summary { cursor: pointer; color: var(--fg); font-weight: 500; }
details ul { margin: 6px 0 0; padding-left: 18px; }
.route { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
.route i { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--muted); display: inline-block; }
.route i.done { background: var(--muted); }
.route i.now { background: var(--lead); border-color: var(--lead); }
.route i.boss { border-radius: 2px; border-color: var(--noise); }
.offer .kind { font-size: 11px; letter-spacing: .08em; color: var(--muted); }
.offer .price { font-family: var(--f-mono); color: var(--gold); font-weight: 600; font-size: 13px; }
.offer:disabled { opacity: .4; cursor: default; }
.coins { color: var(--gold); font-weight: 600; }
canvas#field.hurt { animation: hurt .25s linear; }
@keyframes hurt { 0%,100% { transform: translate(0,0); } 20% { transform: translate(-3px,1px); } 40% { transform: translate(3px,-1px); } 60% { transform: translate(-2px,0); } 80% { transform: translate(2px,1px); } }
@media (prefers-reduced-motion: reduce) { canvas#field.hurt { animation: none; } }
.stats { font-family: var(--f-mono); font-size: 13px; display: grid; grid-template-columns: 1fr auto; gap: 2px 16px; }
.stats span:nth-child(even) { text-align: right; color: var(--fg); font-weight: 600; }
.stats span:nth-child(odd) { color: var(--muted); font-family: var(--f-body); }
.kit-tiles { display: flex; gap: 4px; flex-wrap: wrap; }
.kit-tiles .tile { width: 22px; height: 22px; font-size: 11px; flex: none; }
.kit-tiles .tile.shape-tri, .chip .tile.shape-tri, .offer-head .tile.shape-tri { padding-bottom: 1px; font-size: 9px; max-height: 26px; }
.ranks { display: flex; gap: 6px; flex-wrap: wrap; }
.ranks button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.offer[aria-pressed="true"] { border-color: var(--fg); box-shadow: 0 0 0 1px var(--fg); }
.unlock { color: var(--gold); font-weight: 700; }
.layout { display: flex; flex-direction: column; gap: 14px; }
.main, .side { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.keys { display: none; }
/* Phones: flatten the two columns and keep the hand pinned to the bottom so tiles can be dragged onto the board. */
@media (max-width: 959px) {
  .main, .side { display: contents; }
  .bgm { order: 8; }
  .coach { order: 1; } .relics { order: 2; } .meter { order: 3; } .stage { order: 4; } .controls { order: 5; }
  #handZone { order: 6; position: sticky; bottom: 0; z-index: 6; background: var(--bg); border-top: 1px solid var(--line);
    padding-block: 8px max(8px, env(safe-area-inset-bottom, 0px)); border-radius: 0; }
  #info { order: 7; } .sound { order: 8; } details { order: 9; } .proto { order: 10; }
}
@media (min-width: 960px) {
  .app { max-width: 1180px; }
  .layout { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(300px, 1fr); gap: 20px; align-items: start; }
  .side { position: sticky; top: max(16px, env(safe-area-inset-top, 0px)); }
  canvas#field { height: clamp(150px, 24vh, 250px); }
  .keys { display: inline; }
  .app { padding-block: 14px 20px; }
  #board .cell { aspect-ratio: auto; height: clamp(36px, 6.6vh, 72px); }
  #board .cell .tile { width: auto; height: 74%; aspect-ratio: 1; }
}
.toast { position: fixed; left: 50%; transform: translateX(-50%); top: calc(12px + env(safe-area-inset-top, 0px)); z-index: 40;
  background: var(--fg); color: var(--bg); border-radius: 12px; padding: 10px 16px; font-size: 13px; max-width: calc(100% - 32px); box-shadow: 0 6px 20px rgba(0,0,0,.2); }
.toast b { color: var(--gold); }
.setting { display: grid; grid-template-columns: 9em minmax(0, 1fr) 3em; gap: 10px; align-items: center; font-size: 13px; }
.setting input[type=range] { width: 100%; accent-color: var(--fg); }
.setting output { font-family: var(--f-mono); text-align: right; color: var(--muted); }
.check { display: flex; gap: 8px; align-items: center; font-size: 13px; }
.ach-list { display: grid; gap: 6px; max-height: 50vh; overflow-y: auto; }
.ach { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; align-items: start; font-size: 13px; }
.ach .mark { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--line); margin-top: 2px; }
.ach.got .mark { background: var(--gold); border-color: var(--gold); }
.ach:not(.got) { color: var(--muted); }
.coach { background: var(--surface); border: 2px solid var(--lead); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; font-size: 14px; }
.coach .row b { font-size: 12px; letter-spacing: .06em; color: var(--lead); }
.spot { outline: 3px solid var(--lead) !important; outline-offset: 2px; animation: spot 1.2s ease-in-out infinite; }
@keyframes spot { 50% { outline-color: transparent; } }
@media (prefers-reduced-motion: reduce) { .spot { animation: none; } }
canvas#viz { width: 100%; height: 22px; display: block; }
.bgm { display: flex; flex-direction: column; gap: 6px; }
.bgm .hint { margin: 0; }
.bgm-list { display: flex; flex-wrap: wrap; gap: 6px; }
.bgm-chip { font: inherit; color: var(--fg); background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px;
  padding: 6px 10px; cursor: pointer; display: flex; flex-direction: column; align-items: flex-start; gap: 0; text-align: left; min-width: 0; }
.bgm-chip b { font-size: 13px; }
.bgm-chip small { font-size: 11px; color: var(--muted); }
.bgm-chip[aria-pressed="true"] { border-color: var(--fg); box-shadow: 0 0 0 1px var(--fg); }
.bgm-chip .rec { color: var(--gold); font-size: 10px; font-weight: 700; letter-spacing: .06em; }
.cell.hit .tile { filter: brightness(1.2) drop-shadow(0 0 6px var(--lead)); }
.proto { font-size: 11px; color: var(--muted); letter-spacing: .06em; }
@media (max-width: 460px) {
  .offers, .offers.two { grid-template-columns: 1fr; }
  .board { gap: 3px; grid-template-columns: 12px repeat(8, minmax(0, 1fr)); }
  .stage { padding: 8px; }
}
@media (prefers-reduced-motion: reduce) { .bar.hot > i { animation: none; } }
</style>

<div class="app">
  <header>
    <h1>LOOP</h1>
    <div class="status">
      <span id="stageLabel">STAGE 1/5</span>
      <span class="life" id="lifeLabel">♥ 10</span>
      <span class="coins" id="coinLabel">◎ 0</span>
      <button class="btn ghost small" id="menuBtn" data-i18n="ui.menu" data-i18n-aria="ui.menuAria"></button>
    </div>
  </header>
  <div class="layout">
  <div class="main">
  <div class="relics" id="relics" hidden></div>

  <div class="meter">
    <div class="meter-label"><span data-i18n="ui.noise"></span><b id="noiseText">0 / 30</b></div>
    <div class="bar" id="noiseBar"><i></i></div>
  </div>

  <section class="stage">
    <canvas id="viz" aria-hidden="true"></canvas>
    <canvas id="field" data-i18n-aria="ui.fieldAria"></canvas>
    <div class="legend" id="legend"></div>
    <div class="board" id="beatNums"></div>
    <div class="board" id="board"></div>
    <div class="board-foot"><span class="tempo" id="tempoLabel"></span><span class="over-label" id="overLabel"></span></div>
  </section>

  <div class="controls">
    <button class="btn" id="playBtn"></button>
    <button class="btn ghost" id="listenBtn"></button>
    <button class="btn ghost small" id="speedBtn"></button>
    <span class="hint keys" data-i18n="ui.keys"></span>
  </div>
  </div>
  <div class="side">
  <div class="coach" id="coach" role="status" aria-live="polite" hidden></div>

  <section class="bgm" id="bgmPanel">
    <p class="panel-title" data-i18n="bgm.title"></p>
    <div class="bgm-list" id="bgmList"></div>
    <p class="hint" data-i18n="bgm.note"></p>
  </section>

  <div class="sound">
    <label for="rootSel"><span data-i18n="ui.key"></span>
      <select id="rootSel"></select>
    </label>
    <label for="scaleSel"><span data-i18n="ui.scale"></span>
      <select id="scaleSel"></select>
    </label>
    <span class="hint" data-i18n="ui.soundNote"></span>
  </div>

  <section id="handZone">
    <p class="panel-title" data-i18n="ui.hand"></p>
    <div class="hand" id="hand"></div>
  </section>

  <div class="info" id="info"></div>

  <details>
    <summary data-i18n="ui.howtoTitle"></summary>
    <ul id="howto"></ul>
  </details>
  <p class="proto" data-i18n="ui.proto"></p>
  </div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<div class="overlay" id="overlay" hidden><div class="modal" id="modal"></div></div>

<script src="i18n.js"></script>
<script>
(() => {
'use strict';

// ================= constants =================
const LANES = 4, STEPS = 8, STEP_DUR = 0.3, MAX_LIFE = 10;
const OVERHEAT_STEPS = 8;

const SCALES = {
  dark:   { s: [0, 3, 5, 7, 10] },
  bright: { s: [0, 2, 4, 7, 9] },
  major:  { s: [0, 2, 4, 5, 7, 9, 11] },
  minor:  { s: [0, 2, 3, 5, 7, 8, 10] },
  blues:  { s: [0, 3, 5, 6, 7, 10] },
  miyako: { s: [0, 1, 5, 7, 8] },
};
const NOTE_NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
const PROG = [0, 0, 2, 2, 3, 3, 1, 4];

// Enemy types. speed = field-lengths per second, dmg = life lost on arrival.
const ENEMIES = {
  dot:     { hp: 4,   speed: .09,  dmg: 1, armor: 0, r: 7,  shape: 'circle' },
  dash:    { hp: 3,   speed: .17,  dmg: 1, armor: 0, r: 7,  shape: 'tri' },
  block:   { hp: 18,  speed: .05,  dmg: 3, armor: 1, r: 10, shape: 'square' },
  shield:  { hp: 6,   speed: .07,  dmg: 1, armor: 0, r: 8,  shape: 'shield' },

    const v = vzData[Math.min(vzData.length - 1, Math.floor(Math.pow(i / bars, 1.6) * vzData.length))] / 255;
    const h = Math.max(1.5, v * r.height);
    vx.fillStyle = cols[Math.floor(i / bars * 4)]; vx.globalAlpha = .35 + v * .65;
    vx.fillRect(i * w + 1, r.height - h, w - 2, h);
  }
  vx.globalAlpha = 1;
}

// ---- drag & drop (pointer events: works for mouse and touch) ----
let drag = null, suppressClick = false;
const canEdit = () => ['build', 'play', 'paused'].includes(G.phase);
document.addEventListener('pointerdown', e => {
  if (!canEdit() || (e.pointerType === 'mouse' && e.button !== 0)) return;
  const cell = e.target.closest('#board .cell'), chip = e.target.closest('#hand .chip');
  let src = null;
  if (cell) { const l = +cell.dataset.l, s = +cell.dataset.s, t = G.board[l][s]; if (!t) return; src = { from: 'board', l, s, tile: t, el: cell }; }
  else if (chip) { const t = G.hand[+chip.dataset.i]; if (!t) return; src = { from: 'hand', tile: t, el: chip }; }
  else return;
  drag = { ...src, id: e.pointerId, x0: e.clientX, y0: e.clientY, moved: false, ghost: null };
});
document.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  if (!drag.moved) {
    if (Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) < 6) return;
    drag.moved = true; ensureAudio();
    drag.ghost = document.createElement('div'); drag.ghost.className = 'drag-ghost';
    drag.ghost.innerHTML = tileHTML(drag.tile.id); document.body.appendChild(drag.ghost);
    drag.el.classList.add('dragging');
  }
  e.preventDefault();
  drag.ghost.style.transform = `translate(${e.clientX - 22}px, ${e.clientY - 22}px)`;
  markDrop(e.clientX, e.clientY);
}, { passive: false });
function dropTarget(x, y) {
  const el = document.elementFromPoint(x, y);
  if (!el) return null;
  const cell = el.closest('#board .cell');
  if (cell) return { cell, l: +cell.dataset.l, s: +cell.dataset.s };
  if (el.closest('#handZone')) return { hand: true };
  return null;
}
function markDrop(x, y) {
  document.querySelectorAll('.cell.drop').forEach(c => c.classList.remove('drop'));
  $('handZone').classList.remove('drop');
  const t = dropTarget(x, y);
  if (t?.cell) t.cell.classList.add('drop');
  else if (t?.hand && drag.from === 'board') $('handZone').classList.add('drop');
}
function endDrag(e, cancel) {
  if (!drag || e.pointerId !== drag.id) return;
  const d = drag; drag = null;
  document.querySelectorAll('.cell.drop').forEach(c => c.classList.remove('drop'));
  $('handZone').classList.remove('drop');
  if (!d.moved) return;
  d.ghost.remove(); d.el.classList.remove('dragging');
  suppressClick = true; setTimeout(() => { suppressClick = false; }, 0);
  if (cancel || !canEdit()) return;
  const t = dropTarget(e.clientX, e.clientY);
  if (t?.cell) {
    const cur = G.board[t.l][t.s];
    if (d.from === 'board') {
      if (G.board[d.l][d.s] !== d.tile || (d.l === t.l && d.s === t.s)) return;
      if (!spendEdit()) return;
      if (canMerge(d.tile, cur)) { G.board[d.l][d.s] = null; cur.lv = 2; sfx('pick'); unlock('upgrade'); }
      else { G.board[d.l][d.s] = cur; G.board[t.l][t.s] = d.tile; }
    } else {
      const i = G.hand.indexOf(d.tile); if (i < 0) return;
      if (!spendEdit()) return;
      G.hand.splice(i, 1);
      if (canMerge(d.tile, cur)) { cur.lv = 2; sfx('pick'); unlock('upgrade'); }
      else { G.board[t.l][t.s] = d.tile; if (cur) G.hand.push(cur); }
    }
    G.selHand = -1; G.selCell = { l: t.l, s: t.s };
    playTile(d.tile, t.l, t.s);
  } else if (t?.hand && d.from === 'board') {
    if (G.board[d.l][d.s] !== d.tile) return;
    if (!spendEdit()) return;
    G.board[d.l][d.s] = null; G.hand.push(d.tile); G.selCell = null; G.selHand = -1;
  } else return;
  renderBoard(); renderHand(); renderInfo();
}
document.addEventListener('pointerup', e => endDrag(e, false));

    <div class="row"><button class="btn ghost" id="listenEnd">${t('o.listen')}</button><button class="btn" id="retry">${t('o.retry')}</button></div>`);
  $('listenEnd').onclick = () => { hideModal(); G.enemies = []; G.phase = 'win'; G.listening = true; G.step = -1; renderAll(); };
  $('retry').onclick = () => showStart();
}
function showWin() {
  G.phase = 'win'; renderAll(); store.del('run');
  unlock('clear'); unlock('clear_' + G.kit);
  if (!G.stats.overheats) unlock('cool');
  if (G.rank >= 3) unlock('rank3');
  if (G.rank >= 5) unlock('rank5');
  let unlockMsg = '';
  const best = loadRank();
  if (G.rank >= best && best < RANK_COUNT - 1) { saveRank(best + 1); unlockMsg = `<p class="unlock">${t('v.unlock', { r: best + 1, rank: rankText(best + 1) })}</p>`; }
  showModal(`<h2>${t('v.title')}</h2>
    <p>${t('v.body', { kit: KITS[G.kit].name, r: G.rank })}</p>${unlockMsg}${statsHTML()}
    <div class="row"><button class="btn ghost" id="listenEnd">${t('v.listen')}</button><button class="btn" id="again">${t('v.again')}</button></div>`);
  $('listenEnd').onclick = () => { hideModal(); G.enemies = []; G.listening = true; G.step = -1; renderAll(); };
  $('again').onclick = () => showStart();
}
function showStart() {
  let kit = G ? G.kit : 'rhythm', rank = G ? Math.min(G.rank, loadRank()) : 0;
  const draw = () => {
    const maxRank = loadRank();
    const saved = loadRun();
    showModal(`<div class="row"><h2>LOOP</h2>${langSelect('langStart')}</div>
      ${saved ? `<div class="row"><span class="hint">${t('m.saved', { kit: KITS[saved.kit].name, r: saved.rank, c: saved.col + 1, n: ROUTE_LEN })}</span><button class="btn" id="cont">${t('m.continue')}</button></div>` : ''}
      <p>${saved ? t('m.chooseOverwrite') : t('m.choose')}</p>
      <div class="offers" id="kits">${Object.entries(KITS).map(([k, v]) => `
        <button class="offer" data-kit="${k}" aria-pressed="${k === kit}">
          <span class="offer-name">${v.name}</span>
          <span class="kit-tiles">${v.hand.map(id => tileHTML(id)).join('')}</span>
          <span class="offer-desc">${v.desc}</span></button>`).join('')}</div>
      <div><p class="panel-title">${t('m.rankTitle')}</p>
        <div class="ranks" id="ranks">${Array.from({ length: RANK_COUNT }, (_, i) => `<button class="btn ghost small" data-r="${i}" aria-pressed="${i === rank}" ${i > maxRank ? 'disabled' : ''}>${i}</button>`).join('')}</div>
        <p class="hint" style="margin-top:6px">${t('m.rankLine', { r: rank, list: rank ? Array.from({ length: rank }, (_, i) => rankText(i + 1)).join(t('m.sep')) : t('m.rankNone') })}</p></div>
      ${store.get('tutorialDone', false) ? '' : `<p class="unlock">${t('tut.recommend')}</p>`}
      <div class="row"><span class="row" style="gap:8px"><button class="btn ${store.get('tutorialDone', false) ? 'ghost ' : ''}small" id="tutBtn">${t('tut.btn')}</button><button class="btn ghost small" id="achBtn">${t('m.ach', { a: achGot.size, b: ACHS.length })}</button></span><button class="btn" id="go">${t('m.go')}</button></div>`);
    if (saved) $('cont').onclick = () => { ensureAudio(); resumeRun(saved); };
    $('achBtn').onclick = () => showAchievements(draw);
    $('tutBtn').onclick = () => { ensureAudio(); startTutorial(); };
    $('langStart').onchange = e => { setLang(e.target.value); draw(); };
    $('kits').onclick = e => { const b = e.target.closest('[data-kit]'); if (b) { kit = b.dataset.kit; draw(); } };
    $('ranks').onclick = e => { const b = e.target.closest('[data-r]'); if (b && !b.disabled) { rank = +b.dataset.r; draw(); } };
    $('go').onclick = () => { ensureAudio(); hideModal(); keepKey(() => { G = newGame(kit, rank); }); renderAll(); saveRun(); };
  };
  if (G) { G.phase = 'menu'; G.listening = false; renderAll(); }
  draw();
}
function showAchievements(back) {
  showModal(`<h2>${t('a.title')}</h2><p>${t('a.count', { a: achGot.size, b: ACHS.length })}</p>
    <div class="ach-list">${ACHS.map(id => `<div class="ach ${achGot.has(id) ? 'got' : ''}"><span class="mark"></span><span><b>${t('ach.' + id + '.name')}</b><br>${t('ach.' + id + '.desc')}</span></div>`).join('')}</div>
    <div class="row"><span></span><button class="btn" id="achBack">${t('a.back')}</button></div>`);
  $('achBack').onclick = back;
}
let menuOpen = false;
function showMenu() {
  if (!G || G.phase === 'menu') return;
  if (G.phase === 'play') G.phase = 'paused';
  menuOpen = true; renderStatus();
  const pct = v => Math.round(v * 100);
  showModal(`<h2>${t('ui.menu')}</h2>
    ${langSelect('langMenu')}
    <div class="setting"><label for="volMusic">${t('set.music')}</label><input type="range" id="volMusic" min="0" max="1" step="0.05" value="${SET.music}"><output id="volMusicOut">${pct(SET.music)}</output></div>
    <div class="setting"><label for="volBgm">${t('set.bgm')}</label><input type="range" id="volBgm" min="0" max="1" step="0.05" value="${SET.bgm}"><output id="volBgmOut">${pct(SET.bgm)}</output></div>
    <div class="setting"><label for="volSfx">${t('set.sfx')}</label><input type="range" id="volSfx" min="0" max="1" step="0.05" value="${SET.sfx}"><output id="volSfxOut">${pct(SET.sfx)}</output></div>
    <label class="check" for="shakeChk"><input type="checkbox" id="shakeChk" ${SET.shake ? 'checked' : ''}>${t('set.shake')}</label>
    <p class="hint">${t('set.autosave')}</p>
    <div class="row"><button class="btn ghost small" id="toTitle">${t('set.toTitle')}</button><button class="btn" id="closeMenu">${t('set.close')}</button></div>`);
  const save = () => { store.set('settings', SET); applyVolumes(); };
  $('volMusic').oninput = e => { SET.music = +e.target.value; $('volMusicOut').textContent = pct(SET.music); save(); };
  $('volBgm').oninput = e => { SET.bgm = +e.target.value; $('volBgmOut').textContent = pct(SET.bgm); save(); };
  $('volSfx').oninput = e => { SET.sfx = +e.target.value; $('volSfxOut').textContent = pct(SET.sfx); save(); sfx('pick'); };
  $('shakeChk').onchange = e => { SET.shake = e.target.checked; save(); };
  $('toTitle').onclick = () => { menuOpen = false; showStart(); };
  $('closeMenu').onclick = closeMenu;
  $('langMenu').onchange = e => { setLang(e.target.value); showMenu(); };
}
function closeMenu() { menuOpen = false; hideModal(); renderStatus(); }
$('menuBtn').addEventListener('click', () => { ensureAudio(); showMenu(); });
document.addEventListener('keydown', e => {
  if (e.target.closest('input, select, textarea')) return;
  if (e.key === 'Escape') { e.preventDefault(); if (menuOpen) closeMenu(); else if ($('overlay').hidden) showMenu(); return; }
  if (!$('overlay').hidden) return;
  if (e.key === ' ') { e.preventDefault(); if (e.target.blur) e.target.blur(); $('playBtn').click(); }
  else if (e.key === 'l' || e.key === 'L') $('listenBtn').click();
  else if (e.key === 'x' || e.key === 'X') $('speedBtn').click();
});
// ================= tutorial =================
// A scripted practice battle. Each step highlights what to touch and advances when its goal is met.
const TUT_PLAN = [
  { t: 3, type: 'dot', lane: 1 }, { t: 7, type: 'dot', lane: 1 }, { t: 11, type: 'dot', lane: 2 }, { t: 15, type: 'dot', lane: 1 },
  { t: 19, type: 'shield', lane: 1 }, { t: 23, type: 'dot', lane: 2 }, { t: 26, type: 'shield', lane: 1 },
];
const cellSel = (l, s) => `#board .cell[data-l="${l}"][data-s="${s}"]`;
const TUT = [
  { key: 'tut.intro', spots: ['#field'], next: true },
  { key: 'tut.snare', spots: ['#handZone', cellSel(1, 0)], done: () => G.board[1][0]?.id === 'snare' },
  { key: 'tut.kick', spots: ['#handZone', cellSel(0, 0), cellSel(2, 0), cellSel(3, 0)], done: () => G.board.some(r => r[0]?.id === 'kick') },
  { key: 'tut.tap', spots: ['#handZone'], done: () => { const c = G.selCell; return !!(c && G.board[c.l][c.s]?.id === 'bass'); } },
  { key: 'tut.pitch', spots: ['#info'], next: true },
  { key: 'tut.start', spots: ['#playBtn'], done: () => G.phase === 'play' },
  { key: 'tut.watch', spots: ['#field'], done: () => G.stats.kills >= 1 },
  { key: 'tut.moves', spots: ['#tempoLabel'], next: true },
  { key: 'tut.shield', spots: ['#legend'] },
];
const TUT_START_STEP = TUT.findIndex(x => x.key === 'tut.start');
const inTutorial = () => !!G && G.tutorial != null;
function startTutorial() {
  hideModal(); keepKey(() => { G = newGame('rhythm', 0); });
  G.tutorial = 0; G.plan = TUT_PLAN.map(o => ({ ...o }));
  renderAll();
}
function tutCheck() {
  if (!inTutorial()) return;
  const st = TUT[G.tutorial];
  if (st.done && st.done()) { G.tutorial = Math.min(TUT.length - 1, G.tutorial + 1); tutRender(); renderStatus(); }
}
function tutRender() {
  const el = $('coach');
  if (!inTutorial()) { el.hidden = true; applySpots(); return; }
  const st = TUT[G.tutorial];
  el.hidden = false;
  el.innerHTML = `<div class="row"><b>${t('tut.title')} ${G.tutorial + 1}/${TUT.length}</b><button class="btn ghost small" id="tutSkip">${t('tut.skip')}</button></div>
    <div>${t(st.key)}</div>${st.next ? `<div class="row"><span></span><button class="btn small" id="tutNext">${t('tut.next')}</button></div>` : ''}`;
  $('tutSkip').onclick = () => { store.set('tutorialDone', true); G.tutorial = null; tutRender(); showStart(); };
  if (st.next) $('tutNext').onclick = () => { G.tutorial++; tutRender(); renderStatus(); };
  applySpots();
}
function applySpots() {
  document.querySelectorAll('.spot').forEach(e => e.classList.remove('spot'));
  if (!inTutorial() || G.phase === 'menu') return;
  for (const sel of TUT[G.tutorial].spots) document.querySelectorAll(sel).forEach(e => e.classList.add('spot'));
}
function tutorialDone() {
  store.set('tutorialDone', true);
  showModal(`<h2>${t('tut.doneTitle')}</h2><p>${t('tut.doneBody')}</p>
    <div class="row"><span></span><button class="btn" id="tutPlay">${t('tut.play')}</button></div>`);
  $('tutPlay').onclick = () => { G.tutorial = null; tutRender(); showStart(); };
}
function tutorialFailed() {
  showModal(`<h2>${t('tut.failTitle')}</h2><p>${t('tut.failBody')}</p>
    <div class="row"><button class="btn ghost small" id="tutQuit">${t('tut.skip')}</button><button class="btn" id="tutRetry">${t('tut.retry')}</button></div>`);
  $('tutRetry').onclick = startTutorial;
  $('tutQuit').onclick = () => { store.set('tutorialDone', true); G.tutorial = null; tutRender(); showStart(); };
}
function keepKey(fn) { const r = G ? G.root : 9, sc = G ? G.scale : 'dark', sp = G ? G.speed : 1; fn(); G.root = r; G.scale = sc; G.speed = sp; }

// ================= main loop =================
let last = performance.now();
function frame(now) {
  const raw = Math.min(.1, (now - last) / 1000); last = now;
  const dt = raw * G.speed;
  if (G.phase === 'play') update(dt);
  else if (G.listening) { G.acc += dt; while (G.acc >= STEP_DUR) { G.acc -= STEP_DUR; doStep(); } }
  idleBgm(dt);
  drawField(raw);
  drawViz();
  tutCheck();
  requestAnimationFrame(frame);
}

textGetters(DEFS, 'tile', ['name', 'desc', 'g']);
textGetters(ENEMIES, 'enemy', ['name', 'desc']);
textGetters(RELICS, 'pedal', ['name', 'desc']);
textGetters(NODES, 'node', ['name', 'desc']);
textGetters(KITS, 'kit', ['name', 'desc']);
textGetters(SCALES, 'scale', ['name']);
applyStatic();
G = newGame();
fillSelects();
renderAll();
showStart();
window.__g = { get G() { return G; }, DEFS, startStage, doStep, update, makePlan, enterNode };
requestAnimationFrame(frame);
})();
</script>
