<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>LOOP capsule</title>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=IBM+Plex+Mono:wght@600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; background: #0a0614; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Draws LOOP store art at any size: capsule.html?w=920&h=430&logo=1&tag=Defend%20with%20your%20song
// Layout adapts to the aspect ratio; the sequencer grid is the game's own visual language.
const q = new URLSearchParams(location.search);
const W = +q.get('w') || 920, H = +q.get('h') || 430;
const showLogo = q.get('logo') !== '0', tag = q.get('tag') || '', transparent = q.get('bg') === '0';
const cv = document.getElementById('c'), cx = cv.getContext('2d');
cv.width = W; cv.height = H;

const C = { bg: '#0a0614', cell: '#1d1338', fg: '#f5eeff', muted: '#9b8dc4', drum: '#36d6ff', bass: '#2cf2b4', harm: '#c26dff', lead: '#ffa44d', fx: '#9690c4', noise: '#ff3d7f' };
// A fixed, hand-picked pattern so every capsule shows the same "song".
const PATTERN = [
  ['kick', null, 'hat', null, 'kick', 'hat', null, 'hat'],
  [null, 'snare', null, 'lead', null, 'snare', 'chord', null],
  ['bass', null, 'chord', null, 'bass', null, 'lead', 'bass'],
  [null, 'pad', null, 'echo', null, 'dist', null, 'pad'],
];
const CAT = { kick: 'drum', hat: 'drum', snare: 'drum', bass: 'bass', chord: 'harm', pad: 'harm', lead: 'lead', echo: 'lead', dist: 'fx' };
// Same instrument icons as the game (copied from prototype.html ICONS).
const ICONS = {
  kick:    '<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3.2" fill="currentColor"/><path d="M6 21l2-2.6M18 21l-2-2.6"/>',
  snare:   '<ellipse cx="12" cy="9" rx="8" ry="3"/><path d="M4 9v6.5c0 1.7 3.6 3 8 3s8-1.3 8-3V9"/><path d="M8 12.5v5M12 12.5v6M16 12.5v5"/>',
  hat:     '<path d="M4 7.5c2.5-2.4 13.5-2.4 16 0z" fill="currentColor"/><path d="M4 10.5c2.5 2.4 13.5 2.4 16 0z"/><path d="M12 11.5V21M8.5 21h7"/>',
  cymbal:  '<path d="M2.5 9.5c3.5-4 15.5-4 19 0z" fill="currentColor"/><path d="M12 9.5V21M8 21h8M5 3.5l2 2M19 3.5l-2 2M12 2v2"/>',
  bass:    '<rect x="5" y="2.5" width="14" height="19" rx="2.5"/><circle cx="12" cy="14.5" r="4.5"/><circle cx="12" cy="14.5" r="1.4" fill="currentColor"/><circle cx="12" cy="6.5" r="1.6"/>',
  chord:   '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16M15 4v16"/><path d="M7.2 4h3.6v9H7.2zM13.2 4h3.6v9h-3.6z" fill="currentColor"/>',
  lead:    '<path d="M2 17l5-9v9l5-9v9l5-9v9l5-9"/>',
  echo:    '<circle cx="5" cy="12" r="2.4" fill="currentColor"/><path d="M10 7.5a6 6 0 0 1 0 9M14 5a9.5 9.5 0 0 1 0 14M18 3a12.5 12.5 0 0 1 0 18"/>',
  cresc:   '<path d="M3 12L21 5M3 12l18 7"/>',
  dist:    '<path d="M2 15h3.5l1.5-7h4l2 9h4l1.5-6H22"/><path d="M2 4h20M2 20h20" stroke-dasharray="2 2"/>',
  ghost:   '<path d="M5 21V10a7 7 0 0 1 14 0v11l-2.4-2-2.3 2-2.3-2-2.3 2-2.3-2z"/><circle cx="9.5" cy="10.5" r="1.3" fill="currentColor"/><circle cx="14.5" cy="10.5" r="1.3" fill="currentColor"/>',
  feedback:'<path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 3.5v4h-4"/><circle cx="12" cy="12" r="2.6" fill="currentColor"/>',
  rest:    '<path d="M9.5 2.5l4.5 5.2-3.6 4.3 4.6 4.6c-3-1.2-5.6.2-3.6 5"/>',
  tom:     '<ellipse cx="12" cy="10" rx="7.5" ry="3"/><path d="M4.5 10v5.5c0 1.6 3.4 2.9 7.5 2.9s7.5-1.3 7.5-2.9V10"/><path d="M15 2.5l-3 7.5M19 3.5l-5 6"/>',
  maracas: '<ellipse cx="8" cy="8" rx="4" ry="5" transform="rotate(-25 8 8)"/><path d="M10.2 12.4L13 21"/><ellipse cx="16.5" cy="8" rx="3.6" ry="4.6" transform="rotate(20 16.5 8)" fill="currentColor"/><path d="M15 12.2L12.5 21"/>',
  arp:     '<circle cx="5" cy="18" r="2.2" fill="currentColor"/><circle cx="12" cy="12" r="2.2" fill="currentColor"/><circle cx="19" cy="6" r="2.2" fill="currentColor"/><path d="M7 16.5l3-3M14 10.5l3-3"/>',
  pad:     '<path d="M2 14c2.5-7 5-7 7.5 0s5 7 7.5 0c1.2-3.4 2.5-5 5-5"/><path d="M2 20h20" opacity=".5"/>',
  sync:    '<path d="M7 18V5l11-2v13"/><circle cx="5" cy="18" r="2.5" fill="currentColor"/><circle cx="16" cy="16" r="2.5" fill="currentColor"/><path d="M7 9l11-2"/>',
  clap:    '<path d="M7.5 21c-2.5-2.6-3-6.4-1.5-9.8l2.6-5.6c.6-1.2 2.4-.6 2.1.7l-1 4 4.6-6.6c.8-1.1 2.4-.1 1.8 1.1l-2.9 5.6 4-4.3c.9-.9 2.3.2 1.6 1.3l-3.7 5.5c1.8-.9 3.3.8 2.2 2.1L14 20.4"/><path d="M3 4.5l1.6 1.6M2 9h2M7 2v2"/>',
  rim:     '<ellipse cx="11" cy="14" rx="8" ry="4"/><path d="M3 14v2.5c0 2.2 3.6 4 8 4s8-1.8 8-4V14"/><path d="M8 11.5L21 3.5"/>',
  drop:    '<path d="M12 2.5v11M7 9l5 5 5-5"/><path d="M3 19h4l2-2.5 3 4 3-4 2 2.5h4"/>',
  choir:   '<rect x="8.5" y="2.5" width="7" height="11" rx="3.5"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3.5M8.5 21.5h7"/>',
  stab:    '<path d="M13.5 2L5 13.5h6.2L10 22l9-12h-6.4z" fill="currentColor"/>',
  scratch: '<circle cx="11" cy="13" r="8.5"/><circle cx="11" cy="13" r="4"/><circle cx="11" cy="13" r="1" fill="currentColor"/><path d="M21 2.5v7l-4 5"/>',
};
const iconImg = {};
function loadIcons() {
  return Promise.all(Object.keys(CAT).map(id => new Promise(res => {
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#12081f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" color="#12081f">${ICONS[id].replace(/currentColor/g, '#12081f')}</svg>`;
    const im = new Image(); im.onload = () => { iconImg[id] = im; res(); }; im.onerror = res; im.src = 'data:image/svg+xml,' + encodeURIComponent(svg);
  })));
}
function drawPad(id, x, y, w, glow) {
  const c = C[CAT[id]], r = w * .26;
  const g = cx.createRadialGradient(x + w * .28, y + w * .18, 0, x + w * .28, y + w * .18, w * 1.3);
  g.addColorStop(0, '#ffffff'); g.addColorStop(.12, c); g.addColorStop(1, c);
  cx.shadowColor = c; cx.shadowBlur = glow ? w * .7 : w * .25;
  cx.fillStyle = g; cx.beginPath(); cx.roundRect(x, y, w, w, r); cx.fill(); cx.shadowBlur = 0;
  if (iconImg[id]) cx.drawImage(iconImg[id], x + w * .15, y + w * .15, w * .7, w * .7);
}
const SHAPE = { drum: 'circle', bass: 'square', harm: 'tri', lead: 'diamond', fx: 'square' };

function shape(kind, x, y, r, color) {
  cx.fillStyle = color; cx.beginPath();
  if (kind === 'circle') cx.arc(x, y, r, 0, Math.PI * 2);
  else if (kind === 'square') { const s = r * .9; cx.roundRect(x - s, y - s, s * 2, s * 2, r * .18); }
  else if (kind === 'tri') { cx.moveTo(x, y - r); cx.lineTo(x + r * .95, y + r * .8); cx.lineTo(x - r * .95, y + r * .8); cx.closePath(); }
  else { cx.moveTo(x, y - r); cx.lineTo(x + r, y); cx.lineTo(x, y + r); cx.lineTo(x - r, y); cx.closePath(); }
  cx.fill();
}

function draw() {
  if (transparent) cx.clearRect(0, 0, W, H); else {
    cx.fillStyle = C.bg; cx.fillRect(0, 0, W, H);
    const g1 = cx.createRadialGradient(W * .5, -H * .1, 0, W * .5, -H * .1, Math.max(W, H) * .8);
    g1.addColorStop(0, 'rgba(90,30,170,.75)'); g1.addColorStop(1, 'rgba(90,30,170,0)'); cx.fillStyle = g1; cx.fillRect(0, 0, W, H);
    const g2 = cx.createRadialGradient(W * .5, H * 1.15, 0, W * .5, H * 1.15, Math.max(W, H) * .6);
    g2.addColorStop(0, 'rgba(255,61,154,.45)'); g2.addColorStop(1, 'rgba(255,61,154,0)'); cx.fillStyle = g2; cx.fillRect(0, 0, W, H);
  }
  const wide = W / H >= 1.6, tall = H / W > 1.1;
  // Grid placement: right side on wide art, lower part on tall art, centred otherwise.
  let gx, gy, gw, gh;
  if (!showLogo) { gw = W * .86; gh = gw / 2; gx = (W - gw) / 2; gy = (H - gh) / 2; }
  else if (wide) { gw = Math.min(W * .56, H * .74 * 2); gh = gw / 2; gx = W - gw - W * .05; gy = (H - gh) / 2 + gh * .06; }
  else if (tall) { gw = W * .86; gh = gw / 2; gx = (W - gw) / 2; gy = H * .56; }
  else { gw = W * .8; gh = gw / 2; gx = (W - gw) / 2; gy = H * .44; }
  const cw = gw / 8, ch = gh / 4, pad = Math.min(cw, ch) * .1;

  if (!transparent) {
    // Faint lanes and a speaker line, echoing the battlefield.
    cx.globalAlpha = .5; cx.fillStyle = C.cell;
    for (let l = 0; l < 4; l += 2) cx.fillRect(0, gy + l * ch, W, ch);
    cx.globalAlpha = 1;
    const play = 5; // playhead column
    cx.fillStyle = 'rgba(240,162,64,.16)'; cx.fillRect(gx + play * cw - pad, gy - pad * 3, cw + pad * 2, gh + pad * 6);
    for (let l = 0; l < 4; l++) for (let s = 0; s < 8; s++) {
      const x = gx + s * cw + pad, y = gy + l * ch + pad, w = cw - pad * 2, h = ch - pad * 2;
      cx.fillStyle = C.cell; cx.beginPath(); cx.roundRect(x, y, w, h, Math.min(w, h) * .16); cx.fill();
      const id = PATTERN[l][s]; if (!id) continue;
      const pw = Math.min(w, h) * (s === play ? .86 : .74);
      drawPad(id, x + (w - pw) / 2, y + (h - pw) / 2, pw, s === play);
    }
    // Spectrum strip above the grid.
    const bars = 40, bw = gw / bars;
    for (let i = 0; i < bars; i++) {
      const v = Math.pow(Math.sin(i * .37) * .5 + .5, 1.4) * (1 - i / bars * .7);
      const bh = Math.max(2, v * ch * .55);
      cx.fillStyle = [C.drum, C.bass, C.harm, C.lead][Math.floor(i / bars * 4)]; cx.globalAlpha = .45 + v * .55;
      cx.fillRect(gx + i * bw + 1, gy - pad * 4 - bh, bw - 2, bh);
    }
    cx.globalAlpha = 1;
  }

  if (showLogo) {
    let size, lx, ly, align = 'left';
    if (wide) {
      lx = W * .06; ly = H * .5; size = H * .34;
      cx.font = `400 ${size}px "Dela Gothic One", sans-serif`;
      const room = gx - lx - W * .04, w0 = cx.measureText('LOOP').width;
      if (w0 > room) size *= room / w0;
    }
    else if (tall) {
      lx = W / 2; ly = H * .28; align = 'center'; size = W * .3;
      cx.font = `400 ${size}px "Dela Gothic One", sans-serif`;
      const w0 = cx.measureText('LOOP').width; if (w0 > W * .78) size *= W * .78 / w0;
    }
    else { size = Math.min(W * .2, H * .2); lx = W / 2; ly = H * .24; align = 'center'; }
    if (!wide && !tall && transparent) { size = Math.min(W * .3, H * .5); ly = H * .5; }
    cx.textAlign = align; cx.textBaseline = 'middle';
    cx.font = `400 ${size}px "Dela Gothic One", sans-serif`;
    const m0 = cx.measureText('LOOP'), x0 = align === 'center' ? lx - m0.width / 2 : lx;
    const lg = cx.createLinearGradient(x0, 0, x0 + m0.width, 0); lg.addColorStop(0, '#36d6ff'); lg.addColorStop(.5, '#c26dff'); lg.addColorStop(1, '#ff5fa2');
    cx.shadowColor = '#c26dff'; cx.shadowBlur = size * .25; cx.fillStyle = lg; cx.fillText('LOOP', lx, ly); cx.shadowBlur = 0;
    // Eight step lights under the logo.
    const m = cx.measureText('LOOP'), lw = m.width, sx = align === 'center' ? lx - lw / 2 : lx, sw = lw / 8;
    for (let i = 0; i < 8; i++) { cx.fillStyle = i === 5 ? C.lead : i % 2 ? '#3a4052' : C.drum; cx.fillRect(sx + i * sw + sw * .12, ly + size * .52, sw * .76, size * .09); }
    if (tag) {
      cx.font = `600 ${size * .17}px "IBM Plex Mono", monospace`; cx.fillStyle = C.muted;
      cx.fillText(tag, align === 'center' ? lx : lx, ly + size * .85);
    }
  }
}
Promise.all([loadIcons(), document.fonts.load('400 40px "Dela Gothic One"'), document.fonts.load('600 20px "IBM Plex Mono"')]).then(draw, draw);
</script>
</body>
</html>
